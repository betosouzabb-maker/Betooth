services:
  - type: web
    name: betooth-simple-backend
    runtime: node
    repo: https://github.com/betosouzabb-maker/Betooth
    rootDir: backend-simple
    buildCommand: npm install --ignore-workspace && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_PREFIX
        value: /api/v1
      - key: APP_NAME
        value: Betooth Simple Backend
      - key: APP_URL
        value: https://betooth-simple-backend.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      - key: ADMIN_MASTER_PASSWORD
        generateValue: true
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_PLAN_PRICE_CENTS
        value: "999"
      - key: MP_PLAN_LABEL
        value: Betooth VIP Mensal
      - key: FREE_MONTHLY_DOWNLOAD_LIMIT
        value: "5"
      - key: VIP_CACHE_TTL_SECONDS
        value: "300"
