name: betooth
description: Betooth premium music app base scaffold.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.8.0+1
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  just_audio: ^0.10.4
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.0
  permission_handler: ^12.0.0+1
  connectivity_plus: ^6.1.4
  logger: ^2.6.0
  file_picker: ^8.1.7
  crypto: ^3.0.6
  path: ^1.9.1
  share_plus: ^10.0.2
  flutter_local_notifications: ^17.2.4
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/animations/