name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Flutter Build – Android APK Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Android Gradle Plugin + Gradle 8.x) ─────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Flutter SDK (stable, sem versao fixa para evitar 404) ────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── 4. Verify Flutter installation ───────────────────────────────────────
      - name: Flutter version
        run: flutter --version

      # ── 5. Create required asset directories ─────────────────────────────────
      - name: Create asset directories
        run: |
          mkdir -p assets/fonts assets/icons assets/images assets/animations

      # ── 6. Accept Android SDK licenses ───────────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | flutter doctor --android-licenses 2>/dev/null || true

      # ── 7. Install dependencies ───────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 8. Run code generation (Freezed / json_serializable) ──────────────────
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── 9. Patch Gradle settings for CI compatibility ─────────────────────────
      - name: Patch Gradle for CI
        run: |
          # Reduz memoria JVM para evitar OOM no CI
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=false
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

          # Downgrade Gradle wrapper para versao estavel compativel com Flutter
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          EOF

          # Downgrade AGP e Kotlin para versoes testadas com Flutter
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath =
                  run {
                      val properties = java.util.Properties()
                      file("local.properties").inputStream().use { properties.load(it) }
                      val flutterSdkPath = properties.getProperty("flutter.sdk")
                      require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                      flutterSdkPath
                  }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.25" apply false
          }

          include(":app")
          EOF

          echo "Gradle files patched."
          cat android/gradle.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      # ── 10. Build APK release ─────────────────────────────────────────────────
      - name: Build APK release
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3G"
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      # ── 11. Rename APK for clarity ────────────────────────────────────────────
      - name: Rename APK artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/betooth-v1.0.0-build${{ github.run_number }}.apk

      # ── 12. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: betooth-apk-build${{ github.run_number }}
          path: dist/betooth-v1.0.0-build${{ github.run_number }}.apk
          retention-days: 30
          if-no-files-found: error

      # ── 13. Create GitHub Release (only on push to main) ──────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: "Betooth v1.0.0 (build ${{ github.run_number }})"
          body: |
            ## Betooth v1.0.0 – Build ${{ github.run_number }}

            **APK para Android** (API 21+, Android 5.0+)

            ### Como instalar:
            1. Baixe o arquivo `betooth.apk` abaixo
            2. No Android: Configurações → Segurança → Fontes desconhecidas → Ativar
            3. Abra o APK baixado e toque em Instalar

            Commit: `${{ github.sha }}`
          files: dist/betooth-v1.0.0-build${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 14. Print summary ─────────────────────────────────────────────────────
      - name: Build summary
        run: |
          APK="dist/betooth-v1.0.0-build${{ github.run_number }}.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`$APK\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Build number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
