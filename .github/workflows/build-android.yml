name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Flutter Build – Android APK Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Android Gradle Plugin) ───────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Flutter SDK ───────────────────────────────────────────────────────
      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      # ── 4. Verify Flutter installation ───────────────────────────────────────
      - name: Flutter version
        run: flutter --version

      # ── 5. Install dependencies ───────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 6. (Optional) Run code generation (Freezed / Drift / json_serializable)
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # ── 7. Accept Android SDK licenses ───────────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # ── 8. Build APK release ──────────────────────────────────────────────────
      - name: Build APK release
        run: |
          flutter build apk --release \
            --build-name=1.0.0 \
            --build-number=${{ github.run_number }}

      # ── 9. Rename APK for clarity ─────────────────────────────────────────────
      - name: Rename APK artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/betooth-v1.0.0-build${{ github.run_number }}.apk

      # ── 10. Upload APK artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: betooth-apk-build${{ github.run_number }}
          path: dist/betooth-v1.0.0-build${{ github.run_number }}.apk
          retention-days: 30
          if-no-files-found: error

      # ── 11. Print summary ─────────────────────────────────────────────────────
      - name: Build summary
        run: |
          APK="dist/betooth-v1.0.0-build${{ github.run_number }}.apk"
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`$APK\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Build number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
